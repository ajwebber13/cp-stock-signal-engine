name: CP Analytics Weekly Model Retrain

on:
  schedule:
    - cron: '0 10 * * 6'   # Saturday 5am ET, after markets close for the week
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain models
        run: python train_models.py

      - name: Commit updated models
        run: |
          git config user.name "cp-analytics-bot"
          git config user.email "bot@cultureandpulse.com"
          git add models/
          git diff --staged --quiet || git commit -m "Retrain models $(date +%Y-%m-%d)"
          git push
